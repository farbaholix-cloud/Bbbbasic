<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f3ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Backstage</title>
<script src="static/i18n.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="static/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);
    padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  header h1{font-size:22px;font-style:italic}
  header h1 span{color:var(--accent)}
  .layout{display:grid;grid-template-columns:minmax(440px,560px) 1fr;gap:16px;padding:16px;max-width:1600px;margin:0 auto}
  .layout .chat{order:-1}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-content:start}
  .w{padding:14px;min-width:0;display:flex;flex-direction:column}
  .w.s{grid-column:span 1}.w.m{grid-column:span 2}.w.l{grid-column:span 4}
  .w-head{display:flex;align-items:center;gap:6px;margin-bottom:8px}
  .w-head h3{font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .w.s .w-head h3{white-space:normal}
  .w-tools{display:flex;gap:2px;opacity:.55}
  .w:hover .w-tools{opacity:1}
  @media (hover:hover){.w{position:relative}.w.s .w-tools{position:absolute;top:8px;right:8px;opacity:0;background:var(--panel);border-radius:8px}
    .w.s:hover .w-tools{opacity:1}}
  .w-tools button{padding:2px 6px;border:none;background:transparent;color:var(--muted);font-size:14px}
  .kpi-val{font-family:Fraunces,Georgia,serif;font-size:34px;line-height:1.1}
  .bar{height:6px;border-radius:9px;background:var(--soft);overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;background:var(--accent)}
  .chart-box{position:relative;height:220px}
  table.t{width:100%;border-collapse:collapse;font-size:14px}
  table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
  table.t th{color:var(--muted);font-weight:500}
  .t-wrap{overflow-x:auto}
  .board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(170px,1fr);gap:10px;overflow-x:auto;padding-bottom:4px}
  .col{background:var(--soft);border-radius:10px;padding:8px;min-height:80px}
  .col h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .kcard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 8px;margin-bottom:6px;font-size:14px}
  .kcard .acts{display:flex;gap:2px;margin-top:4px}
  .kcard .acts button{padding:1px 6px;font-size:12px}
  .col input{font-size:13px;padding:6px 8px}
  ul.items{list-style:none;margin:0;padding:0}
  ul.items li{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px solid var(--line)}
  ul.items li.done span.tx{text-decoration:line-through;color:var(--muted)}
  ul.items input[type=checkbox]{width:auto;margin-top:3px}
  ul.items .date{font-size:12px;color:var(--muted);white-space:nowrap}
  ul.items .date.soon{color:var(--bad)}
  .note{white-space:pre-wrap}
  /* чат */
  .chat{position:sticky;top:70px;height:calc(100vh - 86px);display:flex;flex-direction:column;overflow:hidden}
  .agents{display:flex;gap:6px;overflow-x:auto;padding:10px;border-bottom:1px solid var(--line)}
  .agents button{white-space:nowrap;border-radius:999px;padding:3px 11px 3px 3px;font-size:13px;display:inline-flex;align-items:center;gap:7px;transition:all .15s}
  .agents button:hover{border-color:var(--c)}
  .agents button.on{background:var(--c);color:#fff;border-color:var(--c)}
  .agents button.on .av{background:rgba(255,255,255,.25)}
  .msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:92%;padding:9px 12px;border-radius:12px;font-size:14px;overflow-wrap:anywhere}
  .msg.user{align-self:flex-end;background:var(--ink);color:var(--bg);white-space:pre-wrap;border-bottom-right-radius:4px}
  .msg.assistant{align-self:flex-start;background:var(--soft);border-left:3px solid var(--c,var(--accent));border-bottom-left-radius:4px}
  .msg.assistant p{margin:.4em 0}.msg.assistant ul{margin:.3em 0;padding-left:1.2em}
  .msg.assistant h4{margin:.6em 0 .2em;font-size:14px}
  .msg.assistant code{background:var(--panel);padding:0 4px;border-radius:4px}
  .msg .meta{font-size:11px;opacity:.7;margin-top:4px}
  .composer{border-top:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:8px}
  .composer textarea{min-height:44px;max-height:180px}
  .atts{display:flex;gap:6px;flex-wrap:wrap}
  .thinking{align-self:flex-start;color:var(--muted);font-size:13px}
  .thinking::after{content:"";display:inline-block;width:1.2em;animation:dots 1.4s steps(4) infinite}
  @keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
  .empty{color:var(--muted);text-align:center;margin:auto;padding:20px;font-size:14px}
  .svcard{align-self:stretch;border:1.5px solid var(--accent);border-radius:16px;padding:14px 16px;
    background:linear-gradient(100deg,color-mix(in srgb,var(--accent) 9%,transparent),transparent)}
  .svcard h4{margin:0 0 4px;font-family:Fraunces,Georgia,serif;font-weight:500;font-size:17px}
  .svcard p{margin:0 0 10px;font-size:14px;color:var(--muted)}
  .svcard .row{gap:8px}
  .plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:8px}
  .plans .pl{border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
  .plans .pl b{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:17px}
  .plans .pl.cur{border-color:var(--accent)}
  .plans .pl a{margin-top:6px;text-align:center;background:var(--accent);color:#fff;border-radius:10px;padding:7px;text-decoration:none;font-weight:600}
  nav.tabs{display:none}
  .show-m{display:none}
  @media (max-width:1000px){.show-m{display:inline}}
  @media (max-width:1000px){
    .layout{grid-template-columns:1fr;padding:12px 16px 80px}
    .grid{grid-template-columns:repeat(2,1fr)}
    .w.m,.w.l{grid-column:span 2}
    .chat{position:static;height:calc(100vh - 150px);height:calc(100dvh - 150px)}
    header{flex-wrap:nowrap;gap:6px}
    header h1{font-size:17px}
    header{padding-left:12px;padding-right:12px}
    header #who{display:none}
    header .chip{white-space:nowrap}
    header button{padding:7px 10px}
    body[data-tab=dash] .chat{display:none}
    body[data-tab=chat] .grid{display:none}
    nav.tabs{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);
      padding-bottom:env(safe-area-inset-bottom);z-index:20}
    nav.tabs button{flex:1;border:none;border-radius:0;background:transparent;padding:12px 4px;color:var(--muted)}
    nav.tabs button.on{color:var(--accent);font-weight:600}
    header .hide-m{display:none}
  }
  @media (max-width:520px){.grid{grid-template-columns:1fr}.w.s,.w.m,.w.l{grid-column:span 1}}
  .ed-grid{width:100%;font-family:ui-monospace,Menlo,monospace;font-size:13px;min-height:140px}
</style>
</head><body data-tab="chat">
<header>
  <h1>Backstage<span>.</span></h1>
  <span class="chip" id="who">…</span>
  <span class="chip" id="budget" data-i-title="a.spend">$0</span>
  <div class="grow"></div>
  <button class="primary" id="btnPotential"><span class="hide-m" data-i="a.potential"></span><span class="show-m" data-i="a.potential.s"></span></button>
  <button id="btnAdd" data-i-title="a.addw">+<span class="hide-m" data-i="a.widget"></span></button>
  <button id="btnSettings" data-i-title="a.settings">⚙</button>
  <a class="hide-m small guide-link" href="guide" target="_blank" data-i="a.guide"></a>
  <button class="ghost small hide-m" id="btnLogout" data-i="a.logout"></button>
</header>

<div class="layout">
  <section class="grid" id="grid"></section>
  <aside class="card chat" id="chat">
    <div class="agents" id="agents"></div>
    <div class="msgs" id="msgs"></div>
    <div class="composer">
      <div class="atts" id="atts"></div>
      <textarea id="input" rows="2" data-i-ph="a.input"></textarea>
      <div class="row">
        <label class="row small muted" style="margin:0;gap:6px;width:auto" data-i-title="a.deep.t">
          <input type="checkbox" id="deep" style="width:auto"> <span data-i="a.deep"></span>
        </label>
        <div class="grow"></div>
        <input type="file" id="file" class="hidden" multiple accept="image/*,application/pdf,.txt,.csv,.md,.json">
        <button class="ghost" id="btnAttach" data-i-title="a.attach">📎</button>
        <button class="ghost" id="btnClear" data-i-title="a.clear">🧹</button>
        <button class="primary" id="btnSend" data-i="a.send"></button>
      </div>
    </div>
  </aside>
</div>
<nav class="tabs">
  <button data-tab="chat" class="on" data-i="a.tab.team"></button>
  <button data-tab="dash" data-i="a.tab.dash"></button>
</nav>

<dialog id="dlgEdit"><form method="dialog" id="fEdit"></form></dialog>
<dialog id="dlgAdd">
  <form method="dialog">
    <h2 data-i="a.new.h"></h2>
    <label data-i="a.type"></label>
    <select id="addKind">
      <option value="kpi" data-i="a.k.kpi"></option>
      <option value="chart" data-i="a.k.chart"></option>
      <option value="table" data-i="a.k.table"></option>
      <option value="board" data-i="a.k.board"></option>
      <option value="list" data-i="a.k.list"></option>
      <option value="note" data-i="a.k.note"></option>
    </select>
    <label data-i="a.name"></label><input id="addTitle" data-i-ph="a.name.ph">
    <p class="small muted" data-i="a.new.tip"></p>
    <div class="row" style="margin-top:14px"><div class="grow"></div>
      <button value="cancel" data-i="a.cancel"></button><button class="primary" id="addOk" value="ok" data-i="a.create"></button></div>
  </form>
</dialog>
<dialog id="dlgPotential">
  <form method="dialog">
    <h2 data-i="a.pot.h"></h2>
    <p class="small muted" data-i="a.pot.p"></p>
    <textarea id="potText" rows="8"></textarea>
    <div class="row" style="margin-top:14px"><div class="grow"></div>
      <button value="cancel" data-i="a.cancel"></button><button class="primary" id="potOk" value="ok" data-i="a.pot.go"></button></div>
  </form>
</dialog>
<dialog id="dlgSettings">
  <form method="dialog">
    <h2 data-i="a.set.h"></h2>
    <h3 style="margin-top:6px" data-i="a.plan"></h3>
    <div id="planBox" class="small"></div>
    <label data-i="a.set.lang"></label>
    <select id="setLang"><option value="en">English</option><option value="de">Deutsch</option><option value="ua">Українська</option></select>
    <label data-i="a.set.profile"></label>
    <textarea id="setProfile" rows="6"></textarea>
    <label class="row" style="gap:8px"><input type="checkbox" id="setShare" style="width:auto">
      <span data-i="a.set.share"></span></label>
    <p style="margin:12px 0 0"><a href="survey" class="small" data-i="a.sv.edit"></a> →</p>
    <h3 style="margin-top:18px">Telegram</h3>
    <p class="small muted"><span data-i="a.set.tg"></span> <a href="guide#telegram" target="_blank" class="guide-link" data-i="a.set.tg.link"></a>.</p>
    <input id="setTg" data-i-ph="a.set.tg.ph">
    <p class="small" id="tgState"></p>
    <h3 style="margin-top:18px" data-i="a.set.usage"></h3>
    <p class="small" id="usageLine"></p>
    <h3 style="margin-top:18px" data-i="a.set.exp"></h3>
    <div id="insList" class="small"></div>
    <h3 style="margin-top:18px" data-i="a.restart"></h3>
    <p class="small muted" data-i="a.restart.p"></p>
    <button type="button" id="btnRestart" style="color:var(--bad);border-color:var(--bad)" data-i="a.restart"></button>
    <div class="row" style="margin-top:14px"><button type="button" class="ghost" id="btnLogout2" data-i="a.logout"></button><a href="guide" target="_blank" class="small guide-link" data-i="a.guide"></a><div class="grow"></div>
      <button value="cancel" data-i="a.close"></button><button class="primary" id="setOk" value="ok" data-i="a.save"></button></div>
  </form>
</dialog>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const api = async (path, body) => {
  const r = await fetch(path, body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  if (r.status === 401) { location.href = "./"; throw new Error("auth"); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
};
const t = BS.t;
const toast = (t) => { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.append(d); setTimeout(() => d.remove(), 3500); };

const LS = {get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }, del: k => { try { localStorage.removeItem(k); } catch {} }};
let ME = null, WIDGETS = [], AGENT = "maya", CHARTS = {}, ATTS = [];

// ─── Markdown-lite для ответов команды (сначала экранируем, потом размечаем) ───
function md(src) {
  const lines = esc(src).split("\n"); let out = "", list = false;
  const inline = (s) => s.replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|[\s(])[*_]([^*_\n]+)[*_](?=[\s).,!?:;]|$)/g, "$1<i>$2</i>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|\s)(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  for (const l of lines) {
    const li = l.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)/);
    if (li) { if (!list) { out += "<ul>"; list = true; } out += `<li>${inline(li[1])}</li>`; continue; }
    if (list) { out += "</ul>"; list = false; }
    const h = l.match(/^#{1,4}\s+(.*)/);
    if (h) out += `<h4>${inline(h[1])}</h4>`;
    else if (l.trim()) out += `<p>${inline(l)}</p>`;
  }
  return out + (list ? "</ul>" : "");
}

// ─── Дашборд ───
async function loadWidgets() {
  WIDGETS = await api("api/widgets");
  renderGrid();
}
function renderGrid() {
  Object.values(CHARTS).forEach(c => c.destroy()); CHARTS = {};
  const g = $("#grid"); g.innerHTML = "";
  if (!WIDGETS.length) g.innerHTML = `<div class="empty card" style="grid-column:1/-1">${esc(t("a.dash.empty"))}</div>`;
  WIDGETS.forEach((w, i) => {
    const el = document.createElement("div");
    el.className = `card w ${w.size || "m"}`;
    el.innerHTML = `<div class="w-head"><h3 title="${esc(w.title)}">${esc(w.title)}</h3>
      <div class="w-tools">
        <button data-a="up" title="${t("a.up")}">↑</button><button data-a="down" title="${t("a.down")}">↓</button>
        ${w.config.system ? "" : `<button data-a="edit" title="${t("a.edit")}">✎</button><button data-a="del" title="${t("a.del")}">✕</button>`}
      </div></div><div class="w-body"></div>`;
    el.querySelector(".w-tools").onclick = (e) => { const a = e.target.dataset.a; if (a) widgetAction(w, i, a); };
    renderBody(w, el.querySelector(".w-body"));
    g.append(el);
  });
}
const num = (v) => (typeof v === "number" ? v.toLocaleString({en: "en-GB", de: "de-DE", ua: "uk-UA"}[BS.lang]) : esc(v ?? "—"));
function renderBody(w, b) {
  const d = w.data || {}, c = w.config || {};
  if (w.kind === "kpi") {
    const goal = Number(c.goal) || 0, val = Number(d.value) || 0;
    b.innerHTML = `<div class="kpi-val">${num(d.value)}<span class="muted" style="font-size:18px"> ${esc(c.unit || "")}</span></div>
      <div class="small muted">${esc(d.delta || "")}${goal ? ` · ${t("a.goal")} ${num(goal)} ${esc(c.unit || "")}` : ""}</div>
      ${goal ? `<div class="bar"><i style="width:${Math.min(100, val / goal * 100)}%"></i></div>` : ""}`;
  } else if (w.kind === "chart") {
    b.innerHTML = `<div class="chart-box"><canvas></canvas></div>`;
    const css = getComputedStyle(document.documentElement);
    const pal = ["#d9572b", "#3f8fc9", "#3f9b6b", "#c98a1a", "#9b5fc0", "#c4452f"];
    const type = c.type || "line", round = type === "pie" || type === "doughnut";
    CHARTS[w.id] = new Chart(b.querySelector("canvas"), {
      type, data: {labels: d.labels || [], datasets: (d.series || []).map((s, i) => ({
        label: s.name, data: s.values || [], borderColor: round ? css.getPropertyValue("--panel") : pal[i % 6],
        backgroundColor: round ? (d.labels || []).map((_, j) => pal[j % 6]) : pal[i % 6] + (type === "line" ? "33" : "cc"),
        tension: .3, fill: type === "line", spanGaps: true}))},
      options: {maintainAspectRatio: false, plugins: {legend: {display: round || (d.series || []).length > 1,
        labels: {color: css.getPropertyValue("--muted")}}},
        scales: round ? {} : {x: {ticks: {color: css.getPropertyValue("--muted")}, grid: {display: false}},
          y: {ticks: {color: css.getPropertyValue("--muted")}, grid: {color: css.getPropertyValue("--line")}}}}
    });
  } else if (w.kind === "table") {
    const cols = c.columns || [], rows = d.rows || [];
    b.innerHTML = `<div class="t-wrap"><table class="t"><thead><tr>${cols.map(x => `<th>${esc(x)}</th>`).join("")}</tr></thead>
      <tbody>${rows.map(r => `<tr>${r.map(x => `<td>${md(String(x)).replace(/^<p>|<\/p>$/g, "")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
      ${rows.length ? "" : `<p class="small muted">${t("a.t.empty")}</p>`}`;
  } else if (w.kind === "board") {
    const cols = c.columns || [t("a.col.inbox"), t("a.col.doing"), t("a.col.done")], cards = d.cards || [];
    b.innerHTML = `<div class="board">${cols.map((name, ci) => `<div class="col"><h4>${esc(name)}</h4>
      ${cards.filter(k => (k.col || 0) === ci).map(k => `<div class="kcard">${md(k.text).replace(/^<p>|<\/p>$/g, "")}
        <div class="acts">${ci > 0 ? `<button data-m="${k.id}" data-d="-1">←</button>` : ""}${ci < cols.length - 1 ? `<button data-m="${k.id}" data-d="1">→</button>` : ""}
        <div class="grow"></div><button data-x="${k.id}">✕</button></div></div>`).join("")}
      <input placeholder="${t("a.card")}" data-add="${ci}"></div>`).join("")}</div>`;
    b.onclick = (e) => {
      const m = e.target.dataset.m, x = e.target.dataset.x;
      if (m) { const k = cards.find(k => k.id == m); k.col = (k.col || 0) + Number(e.target.dataset.d); saveData(w, {...d, cards}); }
      if (x) saveData(w, {...d, cards: cards.filter(k => k.id != x)});
    };
    b.querySelectorAll("input[data-add]").forEach(inp => inp.onkeydown = (e) => {
      if (e.key === "Enter" && inp.value.trim()) {
        const id = Math.max(0, ...cards.map(k => k.id || 0)) + 1;
        saveData(w, {...d, cards: [...cards, {id, col: Number(inp.dataset.add), text: inp.value.trim()}]});
      }
    });
  } else if (w.kind === "list") {
    const items = d.items || [], today = new Date().toISOString().slice(0, 10);
    const soon = new Date(Date.now() + 7 * 864e5).toISOString().slice(0, 10);
    const sorted = [...items].sort((a, b) => (a.done - b.done) || String(a.date || "9").localeCompare(String(b.date || "9")));
    b.innerHTML = `<ul class="items">${sorted.map(it => `<li class="${it.done ? "done" : ""}">
      <input type="checkbox" data-t="${it.id}" ${it.done ? "checked" : ""}>
      <span class="tx grow">${md(it.text).replace(/^<p>|<\/p>$/g, "")}</span>
      ${it.date ? `<span class="date ${!it.done && it.date <= soon ? "soon" : ""}">${esc(it.date)}</span>` : ""}
      <button class="ghost small" data-x="${it.id}" style="padding:0 4px">✕</button></li>`).join("")}</ul>
      <div class="row" style="margin-top:8px"><input placeholder="${t("a.item")}" class="grow" data-new><input type="date" style="width:140px" data-date></div>`;
    b.onchange = (e) => { const id = e.target.dataset.t; if (id) { items.find(i => i.id == id).done = e.target.checked; saveData(w, {...d, items}); } };
    b.onclick = (e) => { const x = e.target.dataset.x; if (x) saveData(w, {...d, items: items.filter(i => i.id != x)}); };
    const inp = b.querySelector("[data-new]");
    inp.onkeydown = (e) => { if (e.key === "Enter" && inp.value.trim()) {
      const id = Math.max(0, ...items.map(i => i.id || 0)) + 1;
      saveData(w, {...d, items: [...items, {id, text: inp.value.trim(), date: b.querySelector("[data-date]").value, done: false}]}); } };
  } else if (w.kind === "note") {
    b.innerHTML = `<div class="note">${md(d.text || "")}</div>`;
  }
}
async function saveData(w, data) {
  await api(`api/widgets/${w.id}`, {data});
  await loadWidgets();
}
async function widgetAction(w, i, a) {
  if (a === "del") { if (confirm(t("a.del.q", {t: w.title}))) { await api(`api/widgets/${w.id}/delete`, {}); loadWidgets(); } return; }
  if (a === "up" || a === "down") {
    const ids = WIDGETS.map(x => x.id), j = a === "up" ? i - 1 : i + 1;
    if (j < 0 || j >= ids.length) return;
    [ids[i], ids[j]] = [ids[j], ids[i]];
    await api("api/widgets/reorder", {ids}); return loadWidgets();
  }
  if (a === "edit") openEditor(w);
}

// ─── Редактор виджета: заголовок, размер и данные в простом текстовом виде ───
const SEP = ";";
function toGrid(w) {
  const d = w.data || {}, c = w.config || {};
  if (w.kind === "chart") return [[t("a.ed.label"), ...(d.series || []).map(s => s.name)].join(SEP),
    ...(d.labels || []).map((l, i) => [l, ...(d.series || []).map(s => s.values?.[i] ?? "")].join(SEP))].join("\n");
  if (w.kind === "table") return [(c.columns || []).join(SEP), ...(d.rows || []).map(r => r.join(SEP))].join("\n");
  return "";
}
function fromGrid(kind, text) {
  const rows = text.split("\n").map(l => l.split(SEP).map(x => x.trim())).filter(r => r.some(Boolean));
  const head = rows.shift() || [];
  if (kind === "chart") return {data: {labels: rows.map(r => r[0]), series: head.slice(1).map((name, j) => ({name,
    values: rows.map(r => r[j + 1] === "" || r[j + 1] === undefined ? null : Number(String(r[j + 1]).replace(",", ".")))}))}, config: {columns: undefined}};
  return {data: {rows}, config: {columns: head}};
}
function openEditor(w) {
  const f = $("#fEdit"), c = w.config || {}, d = w.data || {};
  let extra = "";
  if (w.kind === "kpi") extra = `<label>${t("a.ed.value")}</label><input name="value" value="${esc(d.value ?? "")}">
    <label>${t("a.ed.caption")}</label><input name="delta" value="${esc(d.delta || "")}">
    <div class="row"><div class="grow"><label>${t("a.ed.unit")}</label><input name="unit" value="${esc(c.unit || "")}"></div>
    <div class="grow"><label>${t("a.ed.goal")}</label><input name="goal" value="${esc(c.goal ?? "")}"></div></div>`;
  if (w.kind === "chart") extra = `<label>${t("a.ed.kind")}</label><select name="type">${["line", "bar", "pie", "doughnut"].map(k =>
    `<option ${c.type === k ? "selected" : ""} value="${k}">${t("a.ch." + k)}</option>`).join("")}</select>
    <label>${t("a.ed.chart")}</label>
    <textarea name="grid" class="ed-grid">${esc(toGrid(w))}</textarea>`;
  if (w.kind === "table") extra = `<label>${t("a.ed.table")}</label>
    <textarea name="grid" class="ed-grid">${esc(toGrid(w))}</textarea>`;
  if (w.kind === "board") extra = `<label>${t("a.ed.board")}</label>
    <textarea name="cols" rows="5">${esc((c.columns || []).join("\n"))}</textarea>`;
  if (w.kind === "note") extra = `<label>${esc(t("a.ed.note"))}</label>
    <textarea name="text" rows="10">${esc(d.text || "")}</textarea>`;
  f.innerHTML = `<h2>${t("a.ed.h")}</h2><label>${t("a.name")}</label><input name="title" value="${esc(w.title)}">
    <label>${t("a.ed.size")}</label><select name="size">${["s", "m", "l"].map(v =>
      `<option value="${v}" ${w.size === v ? "selected" : ""}>${t("a.sz." + v)}</option>`).join("")}</select>
    ${extra}<div class="row" style="margin-top:14px"><div class="grow"></div><button value="cancel">${t("a.cancel")}</button>
    <button class="primary" value="ok">${t("a.save")}</button></div>`;
  const dlg = $("#dlgEdit");
  dlg.onclose = async () => {
    if (dlg.returnValue !== "ok") return;
    const v = Object.fromEntries(new FormData(f));
    let config = {...c}, data = {...d};
    if (w.kind === "kpi") { data.value = Number(String(v.value).replace(",", ".")) || 0; data.delta = v.delta; config.unit = v.unit; config.goal = Number(v.goal) || 0; }
    if (w.kind === "chart") { const r = fromGrid("chart", v.grid); data = r.data; config.type = v.type; }
    if (w.kind === "table") { const r = fromGrid("table", v.grid); data = r.data; config.columns = r.config.columns; }
    if (w.kind === "board") config.columns = v.cols.split("\n").map(s => s.trim()).filter(Boolean);
    if (w.kind === "note") data.text = v.text;
    await api(`api/widgets/${w.id}`, {title: v.title, size: v.size, config, data});
    loadWidgets();
  };
  dlg.returnValue = ""; dlg.showModal();
}

// ─── Чат с командой ───
function renderAgents() {
  $("#agents").innerHTML = Object.entries(ME.agents).map(([id, a]) =>
    `<button data-id="${id}" class="${id === AGENT ? "on" : ""}" style="--c:var(--${id},var(--accent))" title="${esc(a.role)}"><i class="av">${esc(a.name[0])}</i>${esc(a.name)}</button>`).join("");
  $("#chat").style.setProperty("--c", `var(--${AGENT},var(--accent))`);
  $("#agents").onclick = (e) => { const id = e.target.closest("button")?.dataset.id; if (id) { AGENT = id; renderAgents(); loadMsgs(); } };
}
async function loadMsgs() {
  const list = await api(`api/messages?agent=${AGENT}`);
  const box = $("#msgs"), a = ME.agents[AGENT];
  box.innerHTML = list.length ? "" : `<div class="empty"><b>${esc(a.name)}</b>, ${esc(a.role.toLowerCase())}.<br>
    ${esc(t(AGENT === "maya" ? "a.empty.maya" : "a.empty.other"))}</div>`;
  list.forEach(m => addMsg(m.role, m.text, m.meta));
  if (AGENT === "maya" && list.filter(m => m.role === "user").length === 0) {
    const ideas = [t("a.idea1"), t("a.idea2"), t("a.idea3")];
    const wrap = document.createElement("div");
    wrap.className = "row"; wrap.style.cssText = "flex-wrap:wrap;gap:6px;align-self:flex-start";
    wrap.innerHTML = ideas.map(x => `<button class="chip" style="cursor:pointer" data-idea="${esc(x)}">${esc(x)}</button>`).join("");
    wrap.onclick = (e) => { const x = e.target.dataset.idea; if (x) { $("#input").value = x; wrap.remove(); send(); } };
    box.append(wrap);
  }
  if (AGENT === "maya") surveyCard(list);
  planCard();
  box.scrollTop = box.scrollHeight;
}
// Тариф: строка состояния и карточки платных тарифов (ссылки оплаты Stripe)
function planHTML() {
  const p = ME.plan || {}, lim = p.chat_daily != null ? `<br>${esc(t("a.plan.limits", {chat: p.chat_daily, deep: p.deep_daily}))}` : "";
  const line = p.plan === "owner" ? t("a.plan.owner") : p.plan === "trial" ? t("a.plan.trial", {n: p.days_left})
    : p.plan === "expired" ? t("a.plan.over.h") : p.plan === "free" ? t("a.plan.free") : `${p.name} · ${t("a.plan.until", {d: p.until})}`;
  const cards = (ME.offers || []).map(o => `<div class="pl ${o.id === p.plan ? "cur" : ""}"><b>${esc(o.name)}</b><span>${esc(o.price)}</span>
    <span class="muted">${esc(t("a.plan.limits", {chat: o.chat_daily, deep: o.deep_daily}))}</span>
    ${o.id === p.plan ? `<span class="muted">${esc(t("a.plan.current"))}</span>` : `<a href="${esc(o.url)}" target="_blank" rel="noopener">${esc(t("a.plan.choose"))}</a>`}</div>`).join("");
  return `<p style="margin:4px 0"><b>${esc(line)}</b>${p.plan === "owner" || p.plan === "expired" ? "" : lim}</p>${cards ? `<div class="plans">${cards}</div>` : ""}`;
}
function planCard() {
  if (!ME.plan?.expired) return;
  const el = document.createElement("div");
  el.className = "svcard";
  el.innerHTML = `<h4>${esc(t("a.plan.over.h"))}</h4><p>${esc(t("a.plan.over.p"))}</p>${planHTML().replace(/^<p[^]*?<\/p>/, "")}`;
  $("#msgs").append(el);
}
// Подробная анкета: предлагаем после первого разбора (приветствие + разбор = 2 ответа Майи),
// пока она не заполнена; «Позже» прячет приглашение на три дня
function surveyCard(list) {
  if (ME.survey_done || LS.get("bs_job") || list.filter(m => m.role === "assistant").length < 2) return;
  if (Number(LS.get("bs_sv_later") || 0) > Date.now()) return;
  const el = document.createElement("div");
  el.className = "svcard";
  el.innerHTML = `<h4>${esc(t("a.sv.h"))}</h4><p>${esc(t("a.sv.p"))}</p>
    <div class="row"><button class="primary" type="button" data-go>${esc(t("a.sv.go"))} →</button>
    <button class="ghost" type="button" data-later>${esc(t("a.sv.later"))}</button></div>`;
  el.querySelector("[data-go]").onclick = () => { location.href = "survey"; };
  el.querySelector("[data-later]").onclick = () => { LS.set("bs_sv_later", String(Date.now() + 3 * 864e5)); el.remove(); };
  $("#msgs").append(el);
}
function addMsg(role, text, meta = {}) {
  const el = document.createElement("div");
  el.className = `msg ${role}`;
  if (role === "user") el.textContent = text;
  else {
    el.innerHTML = md(text);
    const bits = [];
    if (meta.consulted?.length) bits.push(t("a.asked") + meta.consulted.map(id => ME.agents[id]?.name || id).join(", "));
    if (meta.changed) bits.push(t("a.changed"));
    if (meta.model) bits.push(meta.model);
    if (bits.length) el.insertAdjacentHTML("beforeend", `<div class="meta">${esc(bits.join(" · "))}</div>`);
  }
  $("#msgs").append(el);
  $("#msgs").scrollTop = $("#msgs").scrollHeight;
}
async function send(extra = {}) {
  const text = $("#input").value.trim();
  if (!text && !extra.potential) return;
  const deep = $("#deep").checked;
  if (text) addMsg("user", text + (ATTS.length ? "\n📎 " + ATTS.map(a => a.name).join(", ") : ""));
  $("#input").value = ""; $("#btnSend").disabled = true;
  const wait = document.createElement("div");
  wait.className = "thinking";
  wait.textContent = (extra.potential || deep) ? t("a.deepwait") : t("a.thinks", {name: ME.agents[AGENT].name});
  $("#msgs").append(wait); $("#msgs").scrollTop = $("#msgs").scrollHeight;
  try {
    const {job} = await api("api/chat", {agent: AGENT, text, deep, attachments: ATTS, ...extra});
    ATTS = []; renderAtts();
    LS.set("bs_job", job);
    const res = await pollJob(job);
    wait.remove();
    addMsg("assistant", res.text, res);
    if (res.changed) loadWidgets();
  } catch (e) { wait.remove(); addMsg("assistant", "⚠️ " + e.message); }
  finally { $("#btnSend").disabled = false; LS.del("bs_job"); refreshMe(); }
}
async function pollJob(job) {
  for (;;) {
    await new Promise(r => setTimeout(r, 2000));
    const j = await api(`api/job/${job}`);
    if (j.status === "done") return j.result;
    if (j.status === "error") throw new Error(j.error);
  }
}
function renderAtts() {
  $("#atts").innerHTML = ATTS.map((a, i) => `<span class="chip">📎 ${esc(a.name)} <button class="ghost" data-ix="${i}" style="padding:0">✕</button></span>`).join("");
}
$("#atts").onclick = (e) => { const i = e.target.dataset.ix; if (i !== undefined) { ATTS.splice(i, 1); renderAtts(); } };
$("#btnAttach").onclick = () => $("#file").click();
$("#file").onchange = async (e) => {
  for (const f of e.target.files) {
    if (f.size > 20 * 1024 * 1024) { toast(t("a.big", {name: f.name})); continue; }
    const b64 = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result.split(",")[1]); fr.readAsDataURL(f); });
    ATTS.push({name: f.name, media_type: f.type || "text/plain", data: b64});
  }
  e.target.value = ""; renderAtts();
};
$("#btnSend").onclick = () => send();
$("#input").onkeydown = (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) send(); };
$("#btnClear").onclick = async () => { if (confirm(t("a.clear.q"))) { await api("api/messages/clear", {agent: AGENT}); loadMsgs(); } };

// ─── Шапка, диалоги, вкладки ───
async function refreshMe() {
  ME = await api("api/me");
  if (ME.lang !== BS.lang || !document.documentElement.dataset.ready) {
    BS.set(ME.lang); document.title = t("a.title"); document.documentElement.dataset.ready = 1;
    document.querySelectorAll(".guide-link").forEach(a => a.href = a.getAttribute("href").replace(/^guide(\?lang=\w+)?/, "guide?lang=" + BS.lang));
  }
  $("#who").textContent = ME.name;
  const b = $("#budget");
  if (ME.backend === "cli") { b.textContent = ME.plan?.plan === "owner" ? t("a.sub") : ME.plan?.plan === "free" ? t("a.free") : (ME.plan?.name || t("a.free")); b.title = t("a.sub.t"); }
  else { b.textContent = `$${ME.spent.toFixed(2)} / $${Number(ME.budget).toFixed(0)}`;
    b.style.color = ME.spent >= ME.budget ? "var(--bad)" : ME.spent > ME.budget * .8 ? "var(--warn)" : ""; }
}
$("#btnAdd").onclick = () => { $("#addTitle").value = ""; $("#dlgAdd").returnValue = ""; $("#dlgAdd").showModal(); };
$("#dlgAdd").onclose = async () => {
  if ($("#dlgAdd").returnValue !== "ok") return;
  const kind = $("#addKind").value;
  const presets = {kpi: [{unit: "", goal: 0}, {value: 0}], chart: [{type: "line"}, {labels: [], series: [{name: t("a.value"), values: []}]}],
    table: [{columns: [t("a.col1"), t("a.col2")]}, {rows: []}], board: [{columns: [t("a.col.inbox"), t("a.col.doing"), t("a.col.done")]}, {cards: []}],
    list: [{}, {items: []}], note: [{}, {text: ""}]};
  const w = await api("api/widgets", {kind, title: $("#addTitle").value || t("a.new.h"), config: presets[kind][0], data: presets[kind][1],
    size: kind === "kpi" ? "s" : kind === "board" ? "l" : "m"});
  await loadWidgets(); openEditor(w);
};
$("#btnPotential").onclick = () => { $("#potText").value = ME.profile || ""; $("#dlgPotential").returnValue = ""; $("#dlgPotential").showModal(); };
$("#dlgPotential").onclose = () => {
  if ($("#dlgPotential").returnValue !== "ok") return;
  AGENT = "maya"; renderAgents(); setTab("chat");
  $("#input").value = $("#potText").value;
  loadMsgs().then(() => send({potential: true}));
};
$("#btnSettings").onclick = async () => {
  $("#setLang").value = BS.lang;
  $("#planBox").innerHTML = planHTML();
  $("#setProfile").value = ME.profile || ""; $("#setShare").checked = !!ME.share_insights; $("#setTg").value = "";
  $("#tgState").textContent = t(ME.telegram ? "a.tg.on" : "a.tg.off");
  const u = await api("api/usage");
  const tot = u.reduce((s, r) => s + r.cost, 0), n = u.reduce((s, r) => s + r.n, 0);
  $("#usageLine").textContent = t("a.usage", {n, sum: tot.toFixed(2), chat: ME.model_chat, deep: ME.model_deep});
  const ins = await api("api/insights");
  $("#insList").innerHTML = ins.length ? ins.map(i => `<div style="padding:6px 0;border-bottom:1px solid var(--line)">
    <b>${esc(i.title)}</b> <span class="chip">${t(i.shared ? "a.exp.shared" : "a.exp.mine")}</span><br>${esc(i.body)}
    ${i.shared ? "" : `<button class="ghost small" data-del="${i.id}">${t("a.exp.del")}</button>`}</div>`).join("") : `<span class="muted">${t("a.exp.empty")}</span>`;
  $("#insList").onclick = async (e) => { const id = e.target.dataset.del; if (id) { await api(`api/insights/${id}/delete`, {}); e.target.parentElement.remove(); } };
  $("#dlgSettings").returnValue = ""; $("#dlgSettings").showModal();
};
$("#dlgSettings").onclose = async () => {
  if ($("#dlgSettings").returnValue !== "ok") return;
  const newLang = $("#setLang").value;
  await api("api/profile", {profile: $("#setProfile").value, share_insights: $("#setShare").checked ? 1 : 0, lang: newLang});
  const tg = $("#setTg").value.trim();
  if (tg) { try { await api("api/telegram", {token: tg}); toast(t("a.tg.ok")); } catch (e) { toast(e.message); } }
  if (newLang !== BS.lang) { BS.set(newLang); return location.reload(); }
  refreshMe();
};
$("#btnRestart").onclick = () => { if (confirm(t("a.restart.q"))) location.href = "./?restart=1"; };
const logout = async () => { await api("api/logout", {}); location.href = "./"; };
$("#btnLogout").onclick = logout; $("#btnLogout2").onclick = logout;
function setTab(tab) {
  document.body.dataset.tab = tab;
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  if (tab === "dash") Object.values(CHARTS).forEach(c => c.resize());
}
document.querySelector("nav.tabs").onclick = (e) => { const tab = e.target.dataset.tab; if (tab) setTab(tab); };

(async () => {
  await refreshMe(); renderAgents();
  await Promise.all([loadWidgets(), loadMsgs()]);
  if (location.search.includes("survey=done")) {
    // вернулись из анкеты: подсказка уточнить план — обычным (недорогим) сообщением, не глубоким анализом
    history.replaceState(null, "", "app");
    toast(t("a.sv.done")); setTab("chat");
    const wrap = document.createElement("div");
    wrap.className = "row"; wrap.style.cssText = "flex-wrap:wrap;gap:6px;align-self:flex-start";
    wrap.innerHTML = `<button class="chip" style="cursor:pointer">${esc(t("a.sv.refine"))}</button>`;
    wrap.onclick = () => { $("#input").value = t("a.sv.refine"); wrap.remove(); send(); };
    $("#msgs").append(wrap); $("#msgs").scrollTop = $("#msgs").scrollHeight;
  }
  // Вкладку закрыли посреди ответа — подхватываем задачу, ответ не теряется (он и так сохранён в переписке)
  const pending = LS.get("bs_job");
  if (pending) {
    // Первый разбор после регистрации (или ответ, начатый до закрытия вкладки):
    // показываем, что команда работает, а не пустой чат
    const wait = document.createElement("div");
    wait.className = "thinking";
    const steps = ["a.s1", "a.s2", "a.s3", "a.s4", "a.s5"].map(k => t(k));
    let k = 0; wait.textContent = steps[0];
    const tick = setInterval(() => { k = (k + 1) % steps.length; wait.textContent = steps[k]; }, 9000);
    if (window.innerWidth <= 1000) setTab("chat");  // сначала показать чат, потом прокрутить — скрытый не прокручивается
    $("#msgs").append(wait);
    requestAnimationFrame(() => { $("#msgs").scrollTop = $("#msgs").scrollHeight; });
    pollJob(pending).then(() => { LS.del("bs_job"); loadMsgs(); loadWidgets(); refreshMe(); toast(t("a.first.ready")); })
      .catch((e) => addMsg("assistant", "⚠️ " + e.message))
      .finally(() => { clearInterval(tick); wait.remove(); LS.del("bs_job"); });
  }
  setInterval(() => { if (!document.hidden && !document.activeElement.closest?.(".grid") && !document.querySelector("dialog[open]")) loadWidgets(); }, 60000);  // Telegram-мост мог поменять дашборд
})();
</script>
