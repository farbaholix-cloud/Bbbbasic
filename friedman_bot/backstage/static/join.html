<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f3ec">
<title>Backstage</title>
<script src="static/i18n.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f7f3ec;--card:#fffdf9;--ink:#1f1d1b;--muted:#6b665e;--faint:#a29c92;--line:#e7e0d4;
    --accent:#e0573a;--accent2:#c9432a;--mark:#ffd86b;--soft:#f1ebe1;color-scheme:light;
    --maya:#e0573a;--ruben:#2b8a9a;--hanna:#d89a1e;--konrad:#4659c4;--noa:#cc4a80;--tarik:#3c9a68;--iris:#8a5cd0;--ben:#ec7f2b;--chuck:#3d5a6c}
  @media (prefers-color-scheme:dark){:root{--bg:#151412;--card:#1e1c1a;--ink:#f0ece5;--muted:#a8a197;--faint:#79736b;
    --line:#302d29;--accent:#f06a4b;--accent2:#ff8063;--mark:#8a6a14;--soft:#262421;color-scheme:dark}}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased}
  body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(70px);opacity:.38;pointer-events:none}
  body::before{width:420px;height:420px;top:-140px;right:-120px;background:radial-gradient(circle,#ffb38f,transparent 70%)}
  body::after{width:460px;height:460px;bottom:-180px;left:-160px;background:radial-gradient(circle,#8fd3d6,transparent 70%)}
  main{max-width:560px;margin:0 auto;padding:32px 16px 56px;padding-top:calc(28px + env(safe-area-inset-top));position:relative}
  .serif,h1{font-family:Fraunces,Georgia,serif;font-optical-sizing:auto}
  .brand{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--muted);font-weight:600}
  .brand b{color:var(--accent);font-weight:700}
  .dots{display:flex;gap:6px}
  .dots i{width:22px;height:4px;border-radius:4px;background:var(--line);transition:background .3s,width .3s}
  .dots i.on{width:34px;background:linear-gradient(90deg,var(--maya),var(--ben))}
  .dots i.done{background:var(--ruben)}
  .maya{display:flex;gap:14px;align-items:flex-start;margin:30px 0 18px}
  .av{flex:none;display:grid;place-items:center;border-radius:50%;color:#fff;font-family:Fraunces,Georgia,serif;font-style:italic;font-weight:500}
  .maya .av{width:50px;height:50px;font-size:23px;background:linear-gradient(140deg,#f08a54,var(--maya) 60%,#c23d58);
    box-shadow:0 6px 18px -6px rgba(224,87,58,.55);transform:rotate(-4deg)}
  .bubble{flex:1;background:var(--card);border:1px solid var(--line);border-radius:4px 18px 18px 18px;padding:12px 16px;
    box-shadow:0 8px 24px -16px rgba(60,40,20,.35);animation:fade .35s ease}
  .bubble small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--maya);font-weight:600;margin-bottom:3px}
  .bubble span{font-family:Fraunces,Georgia,serif;font-size:18px;line-height:1.45}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px 26px;
    box-shadow:0 20px 50px -30px rgba(60,40,20,.35)}
  h1{font-size:36px;line-height:1.1;margin:0 0 12px;font-weight:500;letter-spacing:-.01em}
  h1 em{font-style:italic;background:linear-gradient(transparent 62%,var(--mark) 62%,var(--mark) 92%,transparent 92%);padding:0 .08em}
  p.lead{color:var(--muted);margin:0 0 22px;font-size:16px}
  p.lead b{color:var(--ink);font-weight:600}
  label{display:block;font-weight:500;font-size:13px;margin:18px 0 7px;color:var(--ink)}
  label em{font-style:normal;color:var(--faint);font-weight:400}
  input,textarea{width:100%;font:inherit;color:inherit;background:var(--bg);border:1.5px solid transparent;border-radius:12px;
    padding:12px 14px;outline:none;transition:border-color .2s,background .2s}
  input:focus,textarea:focus{border-color:var(--accent);background:var(--card)}
  input::placeholder,textarea::placeholder{color:var(--faint)}
  textarea{resize:vertical;min-height:150px;line-height:1.5}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{--c:var(--accent);border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;
    font:inherit;font-size:14px;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:7px}
  .chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
  .chip:hover{border-color:var(--c);transform:translateY(-1px)}
  .chip.on{background:var(--c);color:#fff;border-color:var(--c)}
  .chip.on::before{background:#fff}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  .btn{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:26px;border:0;border-radius:14px;padding:16px 20px;
    font:inherit;font-weight:600;font-size:16px;color:#fff;background:var(--accent);cursor:pointer;
    box-shadow:0 10px 24px -12px rgba(224,87,58,.8);transition:transform .15s,background .2s,box-shadow .2s}
  .btn span{transition:transform .2s}
  .btn:hover{background:var(--accent2);transform:translateY(-1px)}
  .btn:hover span{transform:translateX(4px)}
  .btn:active{transform:scale(.99)}
  .btn:disabled{opacity:.5;cursor:default;transform:none}
  .ghost{background:none;border:0;color:var(--muted);font:inherit;font-size:14px;cursor:pointer;margin-top:14px;padding:4px 0}
  .ghost:hover{color:var(--ink)}
  .hint{font-size:13px;color:var(--muted);margin-top:8px}
  .ok{color:#2f8a5b}.bad{color:#c13d2b}
  .err{color:#c13d2b;margin-top:12px;min-height:1.4em;font-size:14px}
  .agree{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);margin-top:18px;font-weight:400}
  .agree input{width:16px;height:16px;flex:none;margin-top:3px;accent-color:var(--accent)}
  .trap{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
  .team{list-style:none;margin:4px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .team li{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:14px;background:var(--bg);font-size:13px;line-height:1.3}
  .team .av{width:34px;height:34px;font-size:16px;background:var(--c)}
  .team b{display:block;font-size:14px;font-weight:600}
  .team span{color:var(--muted)}
  .team li.lead{grid-column:1/-1;background:linear-gradient(100deg,rgba(224,87,58,.12),rgba(236,127,43,.06))}
  @media (max-width:420px){.team{grid-template-columns:1fr}}
  .step{display:none}.step.on{display:block;animation:fade .3s ease}
  .faces{display:flex;margin:26px 0 18px}
  .faces .av{width:42px;height:42px;font-size:18px;background:var(--c);border:3px solid var(--card);margin-right:-10px;animation:bob 1.6s ease-in-out infinite}
  .faces .av:nth-child(2){animation-delay:.15s}.faces .av:nth-child(3){animation-delay:.3s}.faces .av:nth-child(4){animation-delay:.45s}.faces .av:nth-child(5){animation-delay:.6s}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .meta{font-size:13px;color:var(--faint);margin-top:14px}
  .foot{margin-top:22px;font-size:14px;color:var(--muted)}
  .foot a{color:var(--accent);font-weight:600;text-underline-offset:3px}
  .langs{display:grid;gap:10px;margin:6px 0 4px}
  .lang{--c:var(--accent);display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1.5px solid var(--line);
    background:var(--card);color:var(--ink);border-radius:16px;padding:16px 18px;font:inherit;cursor:pointer;transition:all .15s}
  .lang:hover{border-color:var(--c);transform:translateY(-1px)}
  .lang .code{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--soft);
    font-weight:700;font-size:13px;letter-spacing:.06em;color:var(--muted);transition:all .15s}
  .lang b{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:22px;flex:1}
  .lang .tick{opacity:0;color:var(--c);font-size:20px;transition:opacity .15s}
  .lang.on{border-color:var(--c);background:linear-gradient(100deg,color-mix(in srgb,var(--c) 10%,transparent),transparent)}
  .lang.on .code{background:var(--c);color:#fff}
  .lang.on .tick{opacity:1}
  #langLead{margin:20px 0 0;animation:fade .3s ease}
</style>
</head><body>
<main>
  <div class="brand"><span>Backstage<b>.</b></span><div class="dots" id="dots"><i></i><i></i><i></i><i></i></div></div>

  <div class="maya">
    <div class="av" aria-hidden="true" data-i="j.av">M</div>
    <div class="bubble" id="bubble"><small data-i="j.maya"></small><span id="say"></span></div>
  </div>

  <form class="card" id="f" autocomplete="off" novalidate>
    <!-- язык -->
    <section class="step on" data-step="lang">
      <h1 data-i-html="j.lang.h"></h1>
      <div class="langs" id="langs">
        <button type="button" class="lang" data-l="en" style="--c:var(--konrad)"><span class="code">EN</span><b>English</b><span class="tick">✓</span></button>
        <button type="button" class="lang" data-l="de" style="--c:var(--accent)"><span class="code">DE</span><b>Deutsch</b><span class="tick">✓</span></button>
        <button type="button" class="lang" data-l="ua" style="--c:var(--hanna)"><span class="code">UA</span><b>Українська</b><span class="tick">✓</span></button>
      </div>
      <p class="lead" id="langLead" data-i="j.lang.lead"></p>
      <button class="btn" type="button" id="langGo"><span data-i="j.lang.go"></span> <span>→</span></button>
    </section>

    <!-- 0 · приветствие -->
    <section class="step" data-step="0">
      <h1 data-i-html="j.h0"></h1>
      <p class="lead" data-i-html="j.lead0"></p>
      <ul class="team">
        <li class="lead"><i class="av" style="--c:var(--maya)" data-i="j.av.maya"></i><div><b data-i="j.t.maya"></b><span data-i="j.t.maya.r"></span></div></li>
        <li><i class="av" style="--c:var(--ruben)" data-i="j.av.ruben"></i><div><b data-i="j.t.ruben"></b><span data-i="j.t.ruben.r"></span></div></li>
        <li><i class="av" style="--c:var(--hanna)" data-i="j.av.hanna"></i><div><b data-i="j.t.hanna"></b><span data-i="j.t.hanna.r"></span></div></li>
        <li><i class="av" style="--c:var(--konrad)" data-i="j.av.konrad"></i><div><b data-i="j.t.konrad"></b><span data-i="j.t.konrad.r"></span></div></li>
        <li><i class="av" style="--c:var(--ben)" data-i="j.av.ben"></i><div><b data-i="j.t.ben"></b><span data-i="j.t.ben.r"></span></div></li>
        <li><i class="av" style="--c:var(--noa)" data-i="j.av.noa"></i><div><b data-i="j.t.noa"></b><span data-i="j.t.noa.r"></span></div></li>
        <li><i class="av" style="--c:var(--iris)" data-i="j.av.iris"></i><div><b data-i="j.t.iris"></b><span data-i="j.t.iris.r"></span></div></li>
        <li><i class="av" style="--c:var(--chuck)" data-i="j.av.chuck"></i><div><b data-i="j.t.chuck"></b><span data-i="j.t.chuck.r"></span></div></li>
      </ul>
      <button class="btn" type="button" data-next><span data-i="j.start"></span> <span>→</span></button>
      <p class="meta" data-i="j.meta0"></p>
      <button class="ghost" type="button" data-back>← <span data-i="j.lang.back">Language</span></button>
    </section>

    <!-- 1 · кто ты -->
    <section class="step" data-step="1">
      <h1 data-i-html="j.h1"></h1>
      <label for="name" data-i="j.name"></label>
      <input id="name" maxlength="40" data-i-ph="j.name.ph">
      <label><span data-i="j.craft"></span> <em data-i="j.craft.many"></em></label>
      <div class="chips" id="crafts"></div>
      <label for="city"><span data-i="j.city"></span> <em data-i="j.opt"></em></label>
      <input id="city" maxlength="60" data-i-ph="j.city.ph">
      <button class="btn" type="button" data-next><span data-i="j.next"></span> <span>→</span></button>
      <button class="ghost" type="button" data-back data-i="j.back"></button>
    </section>

    <!-- 2 · о себе и цель -->
    <section class="step" data-step="2">
      <h1 data-i-html="j.h2"></h1>
      <label for="about" data-i="j.about"></label>
      <textarea id="about" maxlength="1500"></textarea>
      <label for="goal" data-i="j.goal"></label>
      <textarea id="goal" maxlength="800" data-i-ph="j.goal.ph"></textarea>
      <label for="links"><span data-i="j.links"></span> <em data-i="j.opt"></em></label>
      <input id="links" maxlength="300" data-i-ph="j.links.ph">
      <button class="btn" type="button" data-next><span data-i="j.next"></span> <span>→</span></button>
      <button class="ghost" type="button" data-back data-i="j.back"></button>
    </section>

    <!-- 3 · вход -->
    <section class="step" data-step="3">
      <h1 data-i-html="j.h3"></h1>
      <p class="lead" data-i="j.lead3"></p>
      <label for="slug"><span data-i="j.slug"></span> <em data-i="j.slug.latin"></em></label>
      <input id="slug" maxlength="25" autocapitalize="none" spellcheck="false" placeholder="olya">
      <div class="hint" id="slugHint" data-i="j.slug.hint"></div>
      <div class="row">
        <div><label for="pin" data-i="j.pin"></label><input id="pin" type="password" inputmode="numeric" maxlength="8" data-i-ph="j.pin.ph"></div>
        <div><label for="pin2" data-i="j.pin2"></label><input id="pin2" type="password" inputmode="numeric" maxlength="8"></div>
      </div>
      <div class="trap" aria-hidden="true"><label>Website<input id="website" tabindex="-1" autocomplete="off"></label></div>
      <label class="agree"><input type="checkbox" id="agree"><span data-i="j.agree"></span></label>
      <button class="btn" type="submit" id="go"><span data-i="j.go"></span> <span>→</span></button>
      <button class="ghost" type="button" data-back data-i="j.back"></button>
      <div class="err" id="err"></div>
    </section>

    <!-- 4 · передаём анкету -->
    <section class="step" data-step="4">
      <h1 data-i-html="j.h4"></h1>
      <div class="faces" aria-hidden="true"><i class="av" style="--c:var(--maya)" data-i="j.av.maya"></i><i class="av" style="--c:var(--ruben)" data-i="j.av.ruben"></i><i class="av" style="--c:var(--hanna)" data-i="j.av.hanna"></i><i class="av" style="--c:var(--konrad)" data-i="j.av.konrad"></i><i class="av" style="--c:var(--ben)" data-i="j.av.ben"></i></div>
      <p class="lead" data-i="j.lead4"></p>
    </section>

    <section class="step" data-step="closed">
      <h1 data-i-html="j.hc"></h1>
      <p class="lead" data-i="j.leadc"></p>
    </section>
  </form>
  <div class="foot"><span data-i="j.foot"></span> <a href="login" data-i="j.login"></a></div>
</main>
<script>
const $ = (s) => document.querySelector(s);
const t = BS.t;
const steps = [...document.querySelectorAll(".step")];
const CRAFTS = {animation: "noa", illustration: "iris", painting: "maya", mural: "ben", music: "konrad", dance: "noa", theatre: "iris",
  film: "konrad", photo: "ruben", design: "hanna", fashion: "maya", writing: "tarik", other: "faint"};
let cur = "lang", crafts = [], ticket = "", slugTouched = false, closed = false;
// «Начать с нуля» из настроек: та же анкета, но без шага входа — логин и PIN уже есть
const RESTART = new URLSearchParams(location.search).has("restart");
$("#crafts").innerHTML = Object.entries(CRAFTS).map(([k, c]) =>
  `<button type="button" class="chip" data-v="${k}" style="--c:var(--${c})" data-i="j.c.${k}"></button>`).join("");
function say(txt) { const b = $("#bubble"); $("#say").textContent = txt; b.style.animation = "none"; b.offsetHeight; b.style.animation = ""; }
function bubbleFor(i) {
  if (RESTART && (i === "lang" || i === 0)) return t("j.r.say");
  if (i === "lang") return t("j.say.lang");
  if (i === "closed") return t("j.sayc");
  if (i === 1 && crafts.length) return craftLine();
  return t("j.say" + i);
}
function show(i) {
  cur = i; steps.forEach(s => s.classList.toggle("on", s.dataset.step == String(i)));
  document.querySelectorAll("#dots i").forEach((d, k) => { const n = typeof i === "number" ? Math.min(i, 3) : -1; d.classList.toggle("on", k === n); d.classList.toggle("done", k < n); });
  say(bubbleFor(i));
  const first = steps.find(s => s.classList.contains("on"))?.querySelector("input,textarea");
  if (first && window.innerWidth > 700) first.focus();
  window.scrollTo({top: 0, behavior: "smooth"});
}
function setLang(l) {
  BS.set(l);
  document.title = t("j.title");
  document.querySelectorAll(".lang").forEach(b => b.classList.toggle("on", b.dataset.l === BS.lang));
  $("#about").placeholder = t("j.ph." + (crafts[0] || "other"));
  const lead = $("#langLead"); lead.style.animation = "none"; lead.offsetHeight; lead.style.animation = "";
  say(bubbleFor(cur));
}
const TR = {а:"a",б:"b",в:"v",г:"h",ґ:"g",д:"d",е:"e",є:"ye",ж:"zh",з:"z",и:"y",і:"i",ї:"yi",й:"y",к:"k",л:"l",м:"m",н:"n",о:"o",п:"p",р:"r",с:"s",т:"t",у:"u",ф:"f",х:"kh",ц:"ts",ч:"ch",ш:"sh",щ:"shch",ь:"",ю:"yu",я:"ya","'":"","’":"",ä:"ae",ö:"oe",ü:"ue",ß:"ss",ё:"e",ы:"y",э:"e",ъ:""};
const slugify = (s) => [...s.toLowerCase()].map(c => TR[c] ?? c).join("").normalize("NFD").replace(/[\u0300-\u036f]/g, "")
  .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 25);
function validate(i) {
  if (i === 1) {
    if ($("#name").value.trim().length < 2) return t("j.v.name");
    if (!crafts.length) return t("j.v.craft");
  }
  if (i === 2 && $("#about").value.trim().length < 10) return t("j.v.about");
  return "";
}
function craftLine() {
  if (crafts.length === 1) return t("j.cs." + crafts[0]);
  const names = crafts.map(c => t("j.c." + c)).join(", ");
  return t("j.many", {list: names});
}
function pickCraft(v) {
  // «Другое» — отдельный вариант; конкретные области можно сочетать между собой
  if (crafts.includes(v)) crafts = crafts.filter(c => c !== v);
  else crafts = v === "other" ? ["other"] : [...crafts.filter(c => c !== "other"), v];
  document.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", crafts.includes(c.dataset.v)));
  say(crafts.length ? craftLine() : t("j.say1"));
  $("#about").placeholder = t("j.ph." + (crafts[0] || "other"));
}
document.addEventListener("click", (e) => {
  const lb = e.target.closest(".lang");
  if (lb) return setLang(lb.dataset.l);
  if (e.target.closest("#langGo")) return show(closed && !RESTART ? "closed" : 0);
  if (e.target.closest("[data-next]")) {
    const msg = validate(cur);
    if (msg) { say(msg); return; }
    if (RESTART && cur === 2) return restart();
    if (cur === 1 && !slugTouched) { $("#slug").value = slugify($("#name").value); checkSlug(); }
    show(cur + 1);
  }
  if (e.target.closest("[data-back]")) show(cur === 0 ? "lang" : cur - 1);
  const chip = e.target.closest(".chip");
  if (chip) pickCraft(chip.dataset.v);
});
let slugTimer;
async function checkSlug() {
  const v = $("#slug").value.trim().toLowerCase(), h = $("#slugHint");
  h.removeAttribute("data-i");
  if (!/^[a-z0-9][a-z0-9-]{2,24}$/.test(v)) { h.className = "hint"; h.textContent = t("j.slug.hint"); return; }
  try {
    const r = await (await fetch("api/signup/check?slug=" + encodeURIComponent(v))).json();
    h.className = "hint " + (r.free ? "ok" : "bad"); h.textContent = t(r.free ? "j.slug.ok" : "j.slug.bad");
  } catch { h.textContent = ""; }
}
$("#slug").addEventListener("input", () => { slugTouched = true; $("#slug").value = $("#slug").value.toLowerCase().replace(/[^a-z0-9-]/g, ""); clearTimeout(slugTimer); slugTimer = setTimeout(checkSlug, 350); });
["#pin", "#pin2"].forEach(s => $(s).addEventListener("input", (e) => e.target.value = e.target.value.replace(/\D/g, "")));
$("#f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const err = $("#err"); err.textContent = "";
  const pin = $("#pin").value;
  if (pin.length < 4) return err.textContent = t("j.e.pin");
  if (pin !== $("#pin2").value) return err.textContent = t("j.e.pin2");
  if (!$("#agree").checked) return err.textContent = t("j.e.agree");
  $("#go").disabled = true; show(4);
  try {
    const r = await fetch("api/signup", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({
      name: $("#name").value, crafts, craft: crafts[0], city: $("#city").value, about: $("#about").value, goal: $("#goal").value,
      links: $("#links").value, slug: $("#slug").value, pin, agree: true, website: $("#website").value, ticket, lang: BS.lang})});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || t("j.e.generic"));
    try { if (j.job) localStorage.setItem("bs_job", j.job); } catch {}
    setTimeout(() => location.href = "app", 900);
  } catch (ex) { show(3); err.textContent = ex.message; $("#go").disabled = false; say(t("j.e.say", {msg: ex.message})); }
});
async function restart() {
  show(4);
  try {
    const r = await fetch("api/restart", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({
      name: $("#name").value, crafts, craft: crafts[0], city: $("#city").value, about: $("#about").value, goal: $("#goal").value,
      links: $("#links").value, lang: BS.lang, confirm: true})});
    if (r.status === 401) return (location.href = "login");
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || t("j.e.generic"));
    try { if (j.job) localStorage.setItem("bs_job", j.job); localStorage.removeItem("bs_sv_later"); } catch {}
    setTimeout(() => location.href = "app", 900);
  } catch (ex) { show(2); say(t("j.e.say", {msg: ex.message})); }
}
if (RESTART) {
  // кнопка на шаге 2 сразу отправляет анкету; внизу — «передумал» вместо «уже работаешь»
  document.querySelector('[data-step="2"] [data-next] span[data-i]').dataset.i = "j.r.go";
  document.querySelector(".foot").innerHTML = '<span data-i="j.r.cancel"></span> <a href="app" data-i="j.r.back"></a>';
}
setLang(BS.lang);
show("lang");
(async () => {
  try {
    const st = await (await fetch("api/signup/status")).json();
    ticket = st.ticket || "";
    // только явное «закрыто»; сбой сети — не повод прятать форму
    if (st.open === false) closed = true;
  } catch {}
})();
</script>
