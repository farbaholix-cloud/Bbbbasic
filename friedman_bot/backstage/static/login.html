<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f3ec">
<title>Backstage</title>
<script src="static/i18n.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f7f3ec;--card:#fffdf9;--ink:#1f1d1b;--muted:#6b665e;--faint:#a29c92;--line:#e7e0d4;--accent:#e0573a;--accent2:#c9432a;--mark:#ffd86b;color-scheme:light}
  @media (prefers-color-scheme:dark){:root{--bg:#161513;--card:#1e1d1a;--ink:#efebe4;--muted:#a59f95;--faint:#77726a;--line:#2f2d29;--accent:#f06a4b;--accent2:#ff8063;--mark:#8a6a14;color-scheme:dark}}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(70px);opacity:.38;pointer-events:none}
  body::before{width:420px;height:420px;top:-140px;right:-120px;background:radial-gradient(circle,#ffb38f,transparent 70%)}
  body::after{width:460px;height:460px;bottom:-180px;left:-160px;background:radial-gradient(circle,#8fd3d6,transparent 70%)}
  main{max-width:440px;margin:0 auto;padding:32px 16px 56px;padding-top:calc(28px + env(safe-area-inset-top))}
  .brand{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .brand b{color:var(--accent)}
  h1{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:34px;line-height:1.1;margin:40px 0 10px}
  h1 em{font-style:italic;background:linear-gradient(transparent 62%,var(--mark) 62%,var(--mark) 92%,transparent 92%);padding:0 .08em}
  p.lead{color:var(--muted);margin:0 0 22px}
  form{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:0 20px 50px -30px rgba(60,40,20,.35)}
  label{display:block;font-weight:500;font-size:13px;margin:0 0 7px}
  label+input{margin-bottom:16px}
  input{width:100%;font:inherit;color:inherit;background:var(--bg);border:1.5px solid transparent;border-radius:12px;padding:12px 14px;outline:none}
  input:focus{border-color:var(--accent);background:var(--card)}
  button{display:flex;justify-content:space-between;width:100%;margin-top:8px;border:0;border-radius:14px;padding:15px 20px;font:inherit;
    font-weight:600;color:#fff;background:var(--accent);cursor:pointer;transition:background .2s,transform .15s;box-shadow:0 10px 24px -12px rgba(224,87,58,.8)}
  button:hover{background:var(--accent2);transform:translateY(-1px)}
  .err{color:#b3412f;margin-top:12px;min-height:1.4em;font-size:14px}
  .alt{margin-top:26px;padding-top:20px;border-top:1px solid var(--line);font-size:15px}
  .alt a{color:var(--accent);font-weight:600;text-underline-offset:3px}
  .alt p{color:var(--muted);margin:4px 0 0;font-size:14px}
  .small{font-size:13px;color:var(--faint);margin-top:18px}
  .small a{color:var(--muted)}
  .top{display:flex;justify-content:space-between;align-items:center}
  .sw{display:flex;gap:4px}
  .sw button{all:unset;cursor:pointer;font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--faint);padding:4px 7px;border-radius:8px}
  .sw button.on{color:#fff;background:var(--accent)}
</style>
</head><body>
<main>
  <div class="top"><div class="brand">Backstage<b>.</b></div>
    <div class="sw" id="sw"><button type="button" data-l="en">EN</button><button type="button" data-l="de">DE</button><button type="button" data-l="ua">UA</button></div></div>
  <h1 data-i-html="l.h"></h1>
  <p class="lead" data-i="l.lead"></p>
  <form id="f">
    <label for="slug" data-i="l.slug"></label>
    <input id="slug" autocomplete="username" autocapitalize="none" required>
    <label for="key" data-i="l.pin"></label>
    <input id="key" type="password" inputmode="numeric" autocomplete="current-password" required>
    <button type="submit"><span data-i="l.go"></span> <span>→</span></button>
    <div class="err" id="err"></div>
  </form>
  <div class="alt"><a href="./" data-i="l.new"></a>
    <p data-i="l.new2"></p></div>
  <p class="small"><a href="guide" id="guideLink" data-i="l.guide"></a></p>
</main>
<script>
function lang(l) {
  BS.set(l);
  document.title = BS.t("l.title");
  document.querySelectorAll("#sw button").forEach(b => b.classList.toggle("on", b.dataset.l === BS.lang));
  document.getElementById("guideLink").href = "guide?lang=" + BS.lang;
}
document.getElementById("sw").onclick = (e) => { const l = e.target.dataset.l; if (l) lang(l); };
lang(BS.lang);
if (location.search.includes("bad=1")) document.getElementById("err").textContent = BS.t("l.bad");
document.getElementById("f").onsubmit = async (e) => {
  e.preventDefault();
  const r = await fetch("api/login", {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({slug: slug.value, key: key.value, lang: BS.lang})});
  const j = await r.json().catch(() => ({}));
  if (r.ok) { if (j.lang) BS.set(j.lang); location.href = "app"; }
  else document.getElementById("err").textContent = j.error || BS.t("l.fail");
};
</script>
</body></html>
